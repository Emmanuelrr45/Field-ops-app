<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Ops - Submit Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

<div class="bg-white p-6 rounded-lg shadow-md w-full max-w-xl space-y-6">
<div class="flex justify-between items-center border-b pb-4">
<h1 class="text-xl font-bold text-gray-900">Field Visit Report Form</h1>
<a href="index.html" class="text-sm text-blue-600 hover:underline">&larr; Back to Portal</a>
</div>

<form id="reportForm" class="space-y-4">

<div class="mb-4">
<label class="block text-sm font-medium text-gray-700 mb-1">Site / Client Photo</label>
<input type="file" id="visitPhoto" accept="image/*" capture="environment" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
</div>

<div>
<label class="block text-sm font-medium text-gray-700">Agent Name</label>
<input type="text" id="agentName" required class="w-full mt-1 p-2 border rounded-lg">
</div>

<!-- Added CFID and Customer Name Fields -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-gray-700">CFID</label>
<input type="text" id="cfid" required class="w-full mt-1 p-2 border rounded-lg" placeholder="Enter CFID">
</div>
<div>
<label class="block text-sm font-medium text-gray-700">Customer Name</label>
<input type="text" id="customerName" required class="w-full mt-1 p-2 border rounded-lg" placeholder="Enter customer name">
</div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-gray-700">Account Number</label>
<input type="text" id="accountNumber" required class="w-full mt-1 p-2 border rounded-lg">
</div>
<div>
<label class="block text-sm font-medium text-gray-700">Client Account Name</label>
<input type="text" id="clientName" required class="w-full mt-1 p-2 border rounded-lg" placeholder="e.g. Acme Corp">
</div>
</div>

<div>
<label class="block text-sm font-medium text-gray-700">Outcome</label>
<select id="outcome" required class="w-full mt-1 p-2 border rounded-lg">
<option value="">Select Outcome</option>
<option value="Paid">Paid</option>
<option value="Promised to Pay">Promised to Pay</option>
<option value="Not Found">Not Found</option>
<option value="Refused">Refused</option>
</select>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-gray-700">Amount Collected (KSh)</label>
<input type="number" id="amountCollected" value="0" class="w-full mt-1 p-2 border rounded-lg">
</div>
<div>
<label class="block text-sm font-medium text-gray-700">Expenses Incurred (KSh)</label>
<input type="number" id="expensesIncurred" value="0" class="w-full mt-1 p-2 border rounded-lg">
</div>
</div>

<div>
<label class="block text-sm font-medium text-gray-700">Notes / Remarks</label>
<textarea id="notes" rows="3" class="w-full mt-1 p-2 border rounded-lg"></textarea>
</div>

<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
Submit Report
</button>

</form>
</div>

<script src="agent.js"></script>
</body>
</html>
